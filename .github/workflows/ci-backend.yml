name: CI backend

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/ci-backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/ci-backend.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # format, Checkstyle, Error Prone/NullAway, unit + integration tests, ArchUnit,
      # PMD, SpotBugs/FindSecBugs, JaCoCo coverage gate
      - name: Maven verify
        run: ./mvnw -B -ntp verify
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/checkstyle-result.xml
            backend/target/pmd.xml
            backend/target/spotbugsXml.xml
          retention-days: 14
