name: Feature
description: Nouvelle fonctionnalité (sert de spec pour les coding agents)
labels: [feature]
body:
  - type: textarea
    id: context
    attributes:
      label: Contexte / problème
      description: Pourquoi cette fonctionnalité ? Quel besoin utilisateur ?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Liste vérifiable (Given / When / Then). Chaque critère devient au moins un test.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [portfolio, market, assistant, news, simulation, infra, autre]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Hors périmètre
