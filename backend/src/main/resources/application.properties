spring.application.name=investai-backend
spring.threads.virtual.enabled=true

# Boot 4 only reads spring.web.error.* (server.error.* is ignored).
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
# Errors are RFC 9457 problem details built by shared.api.ApiExceptionHandler (ADR-0006).
# Pure JSON API: no static resources, so unknown routes are plain 404 problems.
spring.web.resources.add-mappings=false

# Persistence: Flyway owns the schema, Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.fail-on-missing-locations=true
# Datasource comes from the environment (SPRING_DATASOURCE_*), Docker Compose (local profile)
# or Testcontainers (tests). Never hard-code credentials here.
spring.docker.compose.enabled=false
# Keep column values (e.g. "Key (iban)=(FR76...) already exists") out of PostgreSQL error
# messages, which end up in logs.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-components=always

# Structured JSON logs (ECS) everywhere except the local profile, where plain text is easier to
# read (ADR-0006). Must stay the last document of this file. The separator below must be
# preceded by a blank line, otherwise Spring Boot ignores it (guarded by ApplicationPropertiesTest).

#---
spring.config.activate.on-profile=!local
logging.structured.format.console=ecs
