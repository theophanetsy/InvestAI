spring.application.name=investai-backend
spring.threads.virtual.enabled=true

# Boot 4 only reads spring.web.error.* (server.error.* is ignored).
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
# Errors are RFC 9457 problem details built by shared.api.ApiExceptionHandler (ADR-0006).
# Pure JSON API: no static resources, so unknown routes are plain 404 problems.
spring.web.resources.add-mappings=false

# Persistence: Flyway owns the schema, Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.fail-on-missing-locations=true
# Datasource comes from the environment (SPRING_DATASOURCE_*), Docker Compose (local profile)
# or Testcontainers (tests). Never hard-code credentials here.
spring.docker.compose.enabled=false
# Keep column values (e.g. "Key (iban)=(FR76...) already exists") out of PostgreSQL error
# messages, which end up in logs.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# Single user (ADR-0007), from the environment (infra/.env in the local profile). Startup fails
# when they are missing: generate the hash with scripts/hash-password.mjs.
investai.auth.username=${INVESTAI_USERNAME:}
investai.auth.password-hash=${INVESTAI_PASSWORD_HASH:}
# Session cookie: invisible to JavaScript, never sent cross-site, HTTPS only (local profile excepted).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true

# Expected Host header values; anything else is rejected (DNS rebinding). Override when deployed.
investai.security.allowed-hostnames=localhost,127.0.0.1,[::1]

# OpenAPI contract (ADR-0004): deterministic output, versioned in api/openapi.json. Error responses
# are declared by shared.api.OpenApiConfiguration, not inferred from the exception handlers.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
springdoc.override-with-generic-response=false
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
# Absent fields rather than null: a @Nullable DTO field is optional in the contract.
spring.jackson.default-property-inclusion=non_null
# A decimal JSON number sent for an integer field (a quantity of 1.5) is a 400, never truncated.
spring.jackson.deserialization.accept-float-as-int=false

# Market data (phase 2.1, ADR-0009). Only these scheduled jobs call the providers: Euronext files
# hourly from 9:00 to 23:00 Paris time and once shortly after startup (the application often runs
# in the evening), EODHD maintenance at startup then hourly. Disabled in tests
# and in the verification stack (investai.market.jobs.enabled=false).
investai.market.jobs.enabled=true
investai.market.jobs.collection-cron=0 0 9-23 * * *
investai.market.jobs.collection-startup-delay=PT1M
investai.market.jobs.maintenance-interval=PT1H
investai.market.jobs.maintenance-initial-delay=PT30S
# Identifiable outgoing calls (spec 2.1, criterion 14); the version comes from Maven filtering.
investai.market.user-agent=InvestAI/@project.version@ (personal use; +https://github.com/theophanetsy/InvestAI)
investai.market.http.connect-timeout=PT10S
investai.market.http.read-timeout=PT60S
investai.market.euronext.base-url=https://marketdata.euronext.com
investai.market.euronext.max-uncompressed-size=500MB
# Whole download (the read timeout only bounds the wait between two reads).
investai.market.euronext.download-timeout=PT10M
# Free EODHD key (infra/.env locally). Without it the application starts and collects Euronext
# closes; reference data, history and catch-up are disabled (one warning at startup).
investai.market.eodhd.api-key=${INVESTAI_EODHD_API_KEY:}
investai.market.eodhd.base-url=https://eodhd.com/api
investai.market.eodhd.daily-call-budget=15
investai.market.eodhd.reference-max-age=P7D
# Benchmarks tracked automatically (ISIN:MIC), also PEA-eligible for the eligibility rule (only list
# PEA-eligible ETFs here): Amundi CAC 40 (CAC), Amundi MSCI World (CW8),
# iShares MSCI World Swap PEA (WPEA).
investai.market.benchmarks=FR0007052782:XPAR,LU1681043599:XPAR,IE0002XZSHO1:XPAR
# Benchmarks of the indicators (phase 2.4), computed daily after the collection by the same jobs:
# Amundi MSCI World (CW8) and Amundi CAC 40 (CAC), both listed in investai.market.benchmarks above.
investai.market.indicators.msci-world=LU1681043599:XPAR
investai.market.indicators.cac40=FR0007052782:XPAR

# Version of the application (Maven filtering), reported by the MCP health tool.
investai.version=@project.version@

# MCP server (ADR-0010, spec 3.0): stateless Streamable HTTP on /mcp, mounted only when the token
# hash is set (auth.infrastructure.McpEndpointActivation sets spring.ai.mcp.server.enabled from it;
# do not set that switch here). Generate the token with scripts/mcp-token.mjs.
investai.mcp.token-hash=${INVESTAI_MCP_TOKEN_HASH:}
# Rate limit of /mcp, per sliding minute; authenticated and rejected requests have separate budgets.
investai.mcp.requests-per-minute=120
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=investai
spring.ai.mcp.server.version=${investai.version}
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# Tools and the prompt conseil-placement (phase 3.1); no resources nor completions.
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false
# The server is built by assistant.infrastructure.McpServerConfiguration, like this auto-configuration
# but without the validation of the arguments by the SDK (each tool checks its own and answers
# tool.invalid-argument without the value; spec 3.1, criterion 9). Instructions of the server:
# src/main/resources/assistant/server-instructions.txt, not spring.ai.mcp.server.instructions.
spring.autoconfigure.exclude=org.springframework.ai.mcp.server.common.autoconfigure.McpServerStatelessAutoConfiguration
# Allow-list: tools are declared one by one in assistant.infrastructure.McpToolsConfiguration, never
# discovered by scanning annotations nor converted from Spring AI tool callbacks.
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.tool-callback-converter=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# Probes are public; component details are for authenticated users only.
management.endpoint.health.group.readiness.show-components=when-authorized

# Structured JSON logs (ECS) everywhere except the local profile, where plain text is easier to
# read (ADR-0006). Must stay the last document of this file. The separator below must be
# preceded by a blank line, otherwise Spring Boot ignores it (guarded by ApplicationPropertiesTest).

#---
spring.config.activate.on-profile=!local
logging.structured.format.console=ecs
