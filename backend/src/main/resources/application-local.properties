# Local development: Spring Boot starts infra/docker-compose.yml and derives the datasource from it.
spring.docker.compose.enabled=true
spring.docker.compose.file=../infra/docker-compose.yml
spring.docker.compose.lifecycle-management=start-only

# INVESTAI_USERNAME / INVESTAI_PASSWORD_HASH (ADR-0007) are read from infra/.env, like the database
# password. The application refuses to start without them.
spring.config.import=optional:file:../infra/.env[.properties]
# Loopback only: the API is never reachable from the network.
server.address=127.0.0.1
# Plain HTTP on localhost: browsers would drop a Secure session cookie.
server.servlet.session.cookie.secure=false
