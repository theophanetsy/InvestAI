<h2 mat-dialog-title>Modifier {{ line.instrument.name }}</h2>
<form novalidate [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="line-dialog__content">
    <mat-form-field appearance="outline">
      <mat-label>Quantité</mat-label>
      <input matInput type="number" formControlName="quantity" min="1" step="1" required />
      <mat-error>Indiquez un nombre entier de titres, au moins 1.</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Prix moyen d’achat (€)</mat-label>
      <input matInput formControlName="averagePrice" inputmode="decimal" autocomplete="off" />
      <mat-hint>Laissez vide si inconnu</mat-hint>
      <mat-error>Prix invalide : positif, quatre décimales au plus.</mat-error>
    </mat-form-field>
    @if (error(); as message) {
      <p class="line-dialog__error" role="alert">{{ message }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false">Annuler</button>
    <button mat-flat-button type="submit" [disabled]="saving()">Enregistrer</button>
  </mat-dialog-actions>
</form>
