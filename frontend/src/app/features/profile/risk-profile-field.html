<fieldset class="risk">
  <legend id="risk-label" class="risk__legend">Profil de risque</legend>
  <mat-radio-group
    class="risk__choices"
    aria-labelledby="risk-label"
    required
    [formControl]="control()"
  >
    @for (option of options(); track option.code) {
      <mat-radio-button [value]="option.code">{{ option.label }}</mat-radio-button>
    }
  </mat-radio-group>
  <!-- Live region always present: only its text changes, so every choice is announced. -->
  <p class="risk__description" data-testid="risk-description" aria-live="polite">
    {{ chosen()?.description }}
  </p>
  @if (!chosen() && control().touched) {
    <p class="risk__error" role="alert">Choisissez un profil de risque.</p>
  }
</fieldset>
