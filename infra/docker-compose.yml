# Local development stack. Usage:
#   cp infra/.env.example infra/.env   # then set a password
#   docker compose -f infra/docker-compose.yml up -d
# `./mvnw spring-boot:run` (local profile) starts it automatically.
name: investai

services:
  postgres:
    # Keep in sync with PostgresTestcontainersConfiguration.POSTGRES_IMAGE (checked by a test).
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investai}
      POSTGRES_USER: ${POSTGRES_USER:-investai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env (see infra/.env.example)}
    ports:
      # Loopback only: the database is never reachable from the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
